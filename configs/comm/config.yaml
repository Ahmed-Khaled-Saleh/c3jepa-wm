# configs/comm/config.yaml: the data, training and calibration of the learned power control
# (c3jepa_wm.comm.channel_data, c3jepa_wm.comm.power_control), run by mains/comm_power.py.
#   python comm_power.py                                               # every stage (jobs/comm/comm_power.sh)
#   python comm_power.py stage=collect
#   python comm_power.py stage=trace shard.index=0 shard.count=10      # one of 10 tracing jobs
#   python comm_power.py stage=train link.fading=null calibration.target=0.99
#   python comm_power.py stage=evaluate monte_carlo.runs=20
#   python comm_power.py env.variations=[] data_dir=./comm_data_fixed  # the layouts with FindGoal's fixed numbers of walls
defaults:
  - env: findgoal
  - _self_

env:                           # configs/comm/env/findgoal.yaml, with:
  variations: [obstacles.number, clutter.number]   # each layout's numbers of wall blocks (0-12) and single walls (0-20), drawn from its seed

stage: all                     # collect | trace | train | evaluate | continual | all (in this order; continual if continual.enabled)
data_dir: ./comm_data          # trajectories/, layouts/ (pairs_<seed>.npz or layout_<seed>.npz), deployment.json
out_dir: ${data_dir}          # power_control.pkl, results.json, *.png: a directory per run (e.g. ${data_dir}/runs/lstm-steps) lets
                               # runs with other predictors or histories share data_dir's trajectories and layouts

layouts:                       # reset seeds [start, stop): train the predictor / choose κ and τ / judge
  train: [0, 200]
  calibration: [200, 230]
  test: [230, 260]

shard:                         # collect and trace only every count-th layout from index (SLURM arrays); train and evaluate: count 1
  index: 0
  count: 1

tracing:                       # Sionna RT
  device: cuda                 # cuda (fails if no GPU is visible: no silent CPU fallback) | cpu
  mode: pairs                  # pairs: the pairs of cells the trajectories visit (collect first); full: every pair
  frequency: 2.4e9
  max_depth: 16                # interactions per path (reflections, refractions: through a wall, two). On the 2 m scene, 8
                               # already reached every servable link within 1 dB of 12 (5 missed some); on the 1 m, thin-wall
                               # one, with more paths, 16, still cheap on a GPU (one layout's ~800 pairs: ~15 s at 12)
  scene:                       # SceneConfig fields, e.g. {materials: {inner_wall: brick}}
    cell_size: 1.0             # metres per cell: a 15 × 15 grid is a 15 m × 15 m floor, a step at most 1 m
    thickness:                 # per face of a wall solid (a ray through a wall crosses two): 0.2 m of brick, 0.3 m of concrete
      inner_wall: 0.1
      outer_wall: 0.15
  solver: {}                   # trace_paths / PathSolver options, e.g. {batch: 8, samples_per_src: 4000000}
  overwrite: false             # full: trace again the layouts already traced (pairs are only ever added)

rollouts:                      # the movement in the data should be the movement at deployment
  episodes: 5                  # per layout for training (its first ones), each from its own goal and starts (FindGoal's spawn rule)
  eval_episodes: 40            # collected per layout (every one: the Monte Carlo moves layouts between splits); calibration and
                               # test use them all, so each layout's reliability is measured well (a layout collected with fewer
                               # is collected again, its first episodes the same)
  max_steps: ${env.max_steps}
  policy: {random: 0.2, epsilon_expert: 0.5, waypoint: 0.3}   # stable-marl's MixedPolicy: an episode's behaviour
  epsilon: 0.3                 # random actions of epsilon_expert
  seed: 0
  overwrite: false

link:
  snr_target_db: 10.0          # Γ
  noise_dbm: -94.0             # σ²
  max_power_dbm: -10.0         # ρ_max: g_min = Γσ²/ρ_max = -74 dB, about 20% of the 1 m, thin-wall scene's links unservable
                               # (20 dBm with the 2 m traces of cell-thick walls)
  history: 4                   # past gains the transmitter knows (L)
  history_data: null           # build the data with this many past gains (≥ history), the predictors using the `history` most
                               # recent: runs with different histories are judged on the same transmissions (a link's first
                               # history_data steps are left out); null: history
  channel: large_scale         # coherent: the paths' amplitudes added at the cell's centre (one small-scale draw, frozen);
                               # large_scale: their powers added (path loss, shadowing), the small-scale fading below
  fading: rician               # null, or rician on the large-scale channel: K from the direct path, drawn again when an agent
                               # moves, drifting while both stand still
  step_seconds: 1.0            # an env step's duration: 1 m/s at most
  doppler_hz: 0.1              # the environment's Doppler while the agents stand still (people walking by, doors)
  fading_correlation: null     # ρ between steps while both stand still; null: J₀(2π doppler_hz step_seconds)
  symmetric: true              # average the two traced directions of each pair (the channel is reciprocal)
  seed: 0                      # the fading's draws and the network's payloads (run r of the Monte Carlo: seed + r)

predictor:                     # the saved power control's (LEARNED in the tables; c3jepa_wm.comm.sequence.fit_model)
  kind: trees                  # trees (gradient-boosted) | lstm | gru
  steps: false                 # lstm, gru: over the past steps (each one's gain, the geometry between the agents then, their
                               # moves), not only the past gains
  quantile: 0.05               # the quantile of the gain (dB) predicted; null: the mean
  max_iter: 400                # trees
  learning_rate: 0.05          # trees
  sequence:                    # lstm, gru (fit_sequence_predictor), also evaluation.extra_predictors'
    hidden: 64                 # units of the recurrent cell
    layers: 1
    head: 64                   # units of the MLP's two hidden layers
    dropout: 0.0               # between recurrent layers
    epochs: 60                 # at most: stopped when the loss on held-out training layouts stops improving
    patience: 8
    val_fraction: 0.15         # of the training layouts held out for that
    batch_size: 512
    lr: 2.0e-3
    weight_decay: 1.0e-5
    device: auto               # cuda if there is one

calibration:
  target: 0.95                 # 1 - ε of the saved power control: share of the servable transmissions reaching Γ
  slack: 0.005                 # calibrate for target + slack (the choice lands within about that on new layouts)
  taus_db: [0.0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, .inf]   # withhold when ρ̂ > τ ρ_max; .inf: never
  layouts:                     # also κ and τ chosen for each layout to reach the target, not their transmissions pooled
    coverage: 0.9              # share of new layouts that should (1 - δ): at most m of the n calibration layouts may miss,
                               # (m + 1) / (n + 1) ≤ 1 - coverage (null: off)
    confidence: null           # with this probability over the calibration layouts (binomial, stricter); null: in expectation
    min_servable: 20           # layouts with fewer servable transmissions are left out

evaluation:                    # on the test layouts (c3jepa_wm.comm.evaluation)
  targets: [0.9, 0.95, 0.99]   # operating points: κ and τ chosen on the calibration layouts for each
  baselines: true              # C3-WM's predictor (|h|², dB), history quantile, geometry + history mean (perfect CSI always)
  extra_predictors:            # also these, fit on the training layouts and compared everywhere (test layouts, network,
                               # deployment, Monte Carlo); mean: for the mean gain, else predictor.quantile. The trees'
                               # quantile model joins them when predictor.kind is not trees; the saved predictor is left out
    - {kind: lstm, steps: false}
    - {kind: gru, steps: false}
    - {kind: lstm, steps: true}
    - {kind: gru, steps: true}
    - {kind: lstm, steps: false, mean: true}
    - {kind: gru, steps: false, mean: true}
    - {kind: lstm, steps: true, mean: true}
    - {kind: gru, steps: true, mean: true}
  snr_targets_db: [4, 7, 10, 13, 16]   # also at these Γ: same predictors, κ and τ chosen again for each ([] or null: skip)
  message_bits: 392            # per message: 49 tokens of 8 bits, uncoded BPSK
  bits_per_token: 8
  network: true                # every method as one block of C3-WM's link (comm-core blocks), on the test trajectories
  network_targets: [0.95, 0.99]   # the κ and τ chosen for these targets (each one of `targets`)
  network_layouts: 10          # the first test layouts it runs on (null: all)

deployment:                    # layouts grouped by their distance to the training layouts (c3jepa_wm.comm.deployment)
  enabled: true                # chosen in `collect` (<data_dir>/deployment.json, then kept), collected, traced and judged per group
  groups:                      # group: [lo, hi] of the normalized edit distance to the nearest training layout (0: same walls, 1: none in common)
    in-distribution: [0.0, 0.15]
    slightly OOD: [0.2, 0.4]
    OOD: [0.55, 1.0]
  edited: [in-distribution, slightly OOD]   # made by editing training layouts (cells flipped, as many walls); the others: new layouts
  per_group: 30
  pool: [1000, 20000]          # reset seeds of the new layouts (outside `layouts`)
  first_id: 1000000            # the edited layouts' ids
  episodes: 40                 # per deployment layout: the first `pilot` for the per-layout calibration, the rest judged
  pilot: 2
  shifts:                      # the deployment layouts also with other behaviour policies (each collected into trajectories_<name>/,
                               # traced, and judged with the same predictors and calibration): does the reliability hold when the
                               # agents move differently than in the data? ({}: off)
    expert: {policy: {epsilon_expert: 1.0}, epsilon: 0.0}   # straight to the goal, then still
    random: {policy: {random: 1.0}}                          # uniform actions: turning in place as often as moving
  shift_episodes: 20           # per deployment layout and behaviour
  seed: 0                      # of the edits
  overwrite: false             # choose the layouts again (then collect and trace them again: rollouts.overwrite, a new data_dir)

adaptation:                    # the margin chosen in the deployment layout itself
  predictors: [geometry + history mean, geometry + history quantile (learned)]   # each also with per-layout and online κ
  min_servable: 50             # per-layout: servable pilot transmissions needed (fewer: the offline κ)
  confidence: 0.9              # per-layout: κ whose reliability on the pilot reaches the target by this lower confidence bound (null: the reliability)
  online:                      # outer-loop: κ up δ on a failure, down δ(1-p)/p on a success; δ and p chosen on the calibration layouts
    steps_db: [0.25, 0.5, 1.0, 2.0]
    failure_scales: [1.0, 0.75, 0.5, 0.25]   # p = 1 - (1 - target) × each
    bounds_db: [-10.0, 30.0]   # κ within the offline κ + these

monte_carlo:                   # fitting + calibration + evaluation again on new splits of the traced layouts (nothing traced again)
  runs: 10                     # run 0: the split in `layouts` (the saved power control); runs 1..: new splits of the same layouts
  resplit: true                # each run draws its train / calibration / test layouts from all of them, of the sizes in `layouts`
                               # (the edited deployment layouts' bases always in training)
  network: false               # the network comparison in runs 1.. too (slow; run 0 has it if evaluation.network)
  snr_sweep: false             # the Γ sweep in runs 1.. too
  deployment: true             # the deployment evaluation in runs 1.. too
  seed: 0                      # of the splits

continual:                     # the predictor learning over a stream of layouts met one after another (c3jepa_wm.comm.continual;
                               # Mohsin et al., ICML 2025): each layout's first episodes learned from, its others judged
  enabled: true
  layouts: deployment          # deployment: the deployment layouts, group after group (deployment.groups' order); test: the test layouts
  order: groups                # groups: in-distribution, then slightly OOD, then OOD, each shuffled; random: all shuffled
  runs: 3                      # orders of the stream (seed + run); the predictor is pre-trained once, on the training layouts
  seed: 0
  update_episodes: 2           # of each layout: learned from (the gains the receivers report), the others sent and judged
  recalibrate_every: 5         # layouts between choosing κ and τ again on the calibration layouts (1: after every layout)
  model: {kind: lstm, steps: false, mean: false}   # the learning predictor (lstm | gru; mean: for the mean, else predictor.quantile)
  methods: [frozen, finetune, replay, lars, ewc, si, lwf, joint]
  trees: true                  # also the trees: frozen, and fit again on everything seen every trees_every layouts
  trees_every: 10
  learning:                    # ContinualLearner's: the paper's settings, the epochs and rate for a few hundred samples a layout
    capacity: 5000             # replay buffer (replay, lars)
    epochs: 20                 # over each layout's samples
    batch_size: 64
    lr: 5.0e-4
    replay_weight: 0.5         # of the current layout's loss (replay, lars, joint)
    ewc: 0.4                   # α
    si: 0.4                    # β
    si_xi: 0.1                 # ξ
    lwf: 0.5                   # λ
    clip: 1.0                  # gradient norm
    fisher_samples: 20000      # EWC: at most, per task
    device: auto

wandb:
  enabled: true
  project: c3jepa-comm-power
  name: null                   # null: <stage>-<SLURM job id, or local>
  mode: online                 # online | offline (then: wandb sync <dir>) | disabled
  dir: ${data_dir}             # where wandb keeps its files
  tags: []

hydra:
  run:
    dir: ${data_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
