# configs/comm/config.yaml: the data, training and calibration of the learned power control
# (c3jepa_wm.comm.channel_data, c3jepa_wm.comm.power_control), run by mains/comm_power.py.
#   python comm_power.py                                               # every stage (jobs/comm/comm_power.sh)
#   python comm_power.py stage=collect
#   python comm_power.py stage=trace shard.index=0 shard.count=10      # one of 10 tracing jobs
#   python comm_power.py stage=train link.fading=rayleigh calibration.target=0.99
#   python comm_power.py stage=evaluate monte_carlo.runs=20
#   python comm_power.py env.variations=[] data_dir=./comm_data_fixed  # the layouts with FindGoal's fixed numbers of walls
defaults:
  - env: findgoal
  - _self_

env:                           # configs/comm/env/findgoal.yaml, with:
  variations: [obstacles.number, clutter.number]   # each layout's numbers of wall blocks (0-12) and single walls (0-20), drawn from its seed

stage: all                     # collect | trace | train | evaluate | all (in this order)
data_dir: ./comm_data          # trajectories/, layouts/ (pairs_<seed>.npz or layout_<seed>.npz), power_control.pkl, results.json, *.png

layouts:                       # reset seeds [start, stop): train the predictor / choose κ and τ / judge
  train: [0, 200]
  calibration: [200, 230]
  test: [230, 260]

shard:                         # collect and trace only every count-th layout from index (SLURM arrays); train and evaluate: count 1
  index: 0
  count: 1

tracing:                       # Sionna RT
  device: cuda                 # cuda (fails if no GPU is visible: no silent CPU fallback) | cpu
  mode: pairs                  # pairs: the pairs of cells the trajectories visit (collect first); full: every pair
  frequency: 2.4e9
  max_depth: 5                 # reflections per path
  scene: {}                    # SceneConfig fields, e.g. {materials: {inner_wall: brick}}
  solver: {}                   # trace_paths / PathSolver options, e.g. {batch: 8, samples_per_src: 4000000}
  overwrite: false             # full: trace again the layouts already traced (pairs are only ever added)

rollouts:                      # the movement in the data should be the movement at deployment
  episodes: 5                  # per layout, each from its own goal and starts (FindGoal's spawn rule)
  max_steps: ${env.max_steps}
  policy: {random: 0.2, epsilon_expert: 0.5, waypoint: 0.3}   # stable-marl's MixedPolicy: an episode's behaviour
  epsilon: 0.3                 # random actions of epsilon_expert
  seed: 0
  overwrite: false

link:
  snr_target_db: 10.0          # Γ
  noise_dbm: -94.0             # σ²
  max_power_dbm: 20.0          # ρ_max
  history: 4                   # past gains the transmitter knows (L)
  fading: null                 # null, or rayleigh on top of the traced channel
  fading_correlation: 0.95     # of the fading while both agents stand still
  symmetric: true              # average the two traced directions of each pair (the channel is reciprocal)
  seed: 0                      # the fading's draws and the network's payloads (run r of the Monte Carlo: seed + r)

predictor:
  quantile: 0.05               # the quantile of the gain (dB) predicted; null: the mean
  max_iter: 400
  learning_rate: 0.05

calibration:
  target: 0.95                 # 1 - ε of the saved power control: share of the servable transmissions reaching Γ
  slack: 0.005                 # calibrate for target + slack (the choice lands within about that on new layouts)
  taus_db: [0.0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, .inf]   # withhold when ρ̂ > τ ρ_max; .inf: never

evaluation:                    # on the test layouts (c3jepa_wm.comm.evaluation)
  targets: [0.9, 0.95, 0.99]   # operating points: κ and τ chosen on the calibration layouts for each
  baselines: true              # C3-WM's predictor (|h|², dB), history quantile, geometry + history mean (perfect CSI always)
  snr_targets_db: [4, 7, 10, 13, 16]   # also at these Γ: same predictors, κ and τ chosen again for each ([] or null: skip)
  message_bits: 392            # per message: 49 tokens of 8 bits, uncoded BPSK
  bits_per_token: 8
  network: true                # every method as one block of C3-WM's link (comm-core blocks), on the test trajectories
  network_targets: [0.95, 0.99]   # the κ and τ chosen for these targets (each one of `targets`)
  network_layouts: 10          # the first test layouts it runs on (null: all)

deployment:                    # layouts grouped by their distance to the training layouts (c3jepa_wm.comm.deployment)
  enabled: true                # chosen in `collect` (<data_dir>/deployment.json, then kept), collected, traced and judged per group
  groups:                      # group: [lo, hi] of the normalized edit distance to the nearest training layout (0: same walls, 1: none in common)
    in-distribution: [0.0, 0.15]
    slightly OOD: [0.2, 0.4]
    OOD: [0.55, 1.0]
  edited: [in-distribution, slightly OOD]   # made by editing training layouts (cells flipped, as many walls); the others: new layouts
  per_group: 30
  pool: [1000, 20000]          # reset seeds of the new layouts (outside `layouts`)
  first_id: 1000000            # the edited layouts' ids
  episodes: 10                 # per deployment layout: the first `pilot` for the per-layout calibration, the rest judged
  pilot: 2
  seed: 0                      # of the edits
  overwrite: false             # choose the layouts again (then collect and trace them again: rollouts.overwrite, a new data_dir)

adaptation:                    # the margin chosen in the deployment layout itself
  predictors: [geometry + history mean, geometry + history quantile (learned)]   # each also with per-layout and online κ
  min_servable: 50             # per-layout: servable pilot transmissions needed (fewer: the offline κ)
  confidence: 0.9              # per-layout: κ whose reliability on the pilot reaches the target by this lower confidence bound (null: the reliability)
  online:                      # outer-loop: κ up δ on a failure, down δ(1-p)/p on a success; δ and p chosen on the calibration layouts
    steps_db: [0.25, 0.5, 1.0, 2.0]
    failure_scales: [1.0, 0.75, 0.5, 0.25]   # p = 1 - (1 - target) × each
    bounds_db: [-10.0, 30.0]   # κ within the offline κ + these

monte_carlo:                   # fitting + calibration + evaluation again on new splits of the traced layouts (nothing traced again)
  runs: 10                     # run 0: the split in `layouts` (the saved power control); runs 1..: new splits of the same layouts
  resplit: true                # each run draws its train / calibration / test layouts from all of them, of the sizes in `layouts`
                               # (the edited deployment layouts' bases always in training)
  network: false               # the network comparison in runs 1.. too (slow; run 0 has it if evaluation.network)
  snr_sweep: false             # the Γ sweep in runs 1.. too
  deployment: true             # the deployment evaluation in runs 1.. too
  seed: 0                      # of the splits

wandb:
  enabled: true
  project: c3jepa-comm-power
  name: null                   # null: <stage>-<SLURM job id, or local>
  mode: online                 # online | offline (then: wandb sync <dir>) | disabled
  dir: ${data_dir}             # where wandb keeps its files
  tags: []

hydra:
  run:
    dir: ${data_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
