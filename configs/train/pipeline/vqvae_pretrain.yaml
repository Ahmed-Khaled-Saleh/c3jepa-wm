# configs/pipeline/vqvae_pretrain.yaml
defaults:
  - /datamodule: vqvae_data
  - /model: vqvae
  - _self_

stage: 1

# Define Stage 1 specific hyperparameters here
lr: 3e-4
max_epochs: 50

# The training options of the VQ-VAE (model/vqvae.yaml stays as the checkpoints in use were trained: the other
# pipelines build the model from it). A checkpoint trained with these needs pre_quant_activation: false where it is loaded.
model:
  beta: 0.25                     # the commitment loss's weight
  pre_quant_activation: false    # the encoder's output quantized as it is
  dead_threshold: 0.03           # a code picked fewer times per batch (an EMA) restarts on an encoder output

datamodule:
  data_dir: /scratch/project_2009050/datasets/findgoal_layouts   # collect_world.py's dataset (the partner drawn in the POV)
  val_layouts: [200, 260]        # trained on layouts 0-199, as the channel predictor
  val_frames: 20000              # of the validation layouts' ~330k frames, judged every epoch
  num_workers: 8
  persistent_workers: true

trainer:
  _target_: c3jepa_wm.trainers.msg_trainer.VQVAETrainer
  epochs: ${pipeline.max_epochs} # Automatically grabs 50
  lr: ${pipeline.lr}             # Automatically grabs 3e-4
  project_name: ${logging_params.project_name} # Grabs from config.yaml
  ckp_dir: ${logging_params.ckp_dir}             # Grabs from config.yaml
  save_dir: ${logging_params.save_dir}           # Grabs from config.yaml
  rarity_power: 0.5              # a tile weighs its kind's share ** -0.5 (goal and partner tiles ~10x a wall's)
  tile_tolerance: 64             # a tile is reconstructed when no pixel is off by more than 64 / 255
  select: tiles                  # checkpoints and early stopping on the mean tile accuracy over the kinds of tiles
