hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - device=cpu
    - planner.solver=c3jepa
    - methods=[learned,lambda-policy]
    - episodes=2
    - num_envs=2
    - max_steps=6
    - planner.num_samples=4
    - planner.n_steps=1
    - planner.topk=2
    - planner.horizon=2
    - jepa.predictor.depth=2
    - jepa.predictor.mlp_dim=256
    - vqvae.pre_quant_activation=true
    - checkpoints.jepa=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/wm_ckp/wm_test/local_run/agent_WM_trainer/last_state.pt
    - checkpoints.vqvae=/home/ahmed/Ahmed-home/1- Projects/Research/Journal 2/code/c3jepa-wm/0_results/vqvae_ckp.pt
    - checkpoints.power_control=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/e2e_lam/power_control.pkl
    - data_dir=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/e2e
    - layouts=[6,8]
    - env.variations=[obstacles.number,clutter.number]
    - tracing.max_depth=4
    - +tracing.solver.samples_per_src=20000
    - out_dir=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/deploy_lam
    - wandb.enabled=false
  job:
    name: deploy
    chdir: null
    override_dirname: +tracing.solver.samples_per_src=20000,checkpoints.jepa=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/wm_ckp/wm_test/local_run/agent_WM_trainer/last_state.pt,checkpoints.power_control=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/e2e_lam/power_control.pkl,checkpoints.vqvae=/home/ahmed/Ahmed-home/1-
      Projects/Research/Journal 2/code/c3jepa-wm/0_results/vqvae_ckp.pt,data_dir=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/e2e,device=cpu,env.variations=[obstacles.number,clutter.number],episodes=2,jepa.predictor.depth=2,jepa.predictor.mlp_dim=256,layouts=[6,8],max_steps=6,methods=[learned,lambda-policy],num_envs=2,out_dir=/tmp/claude-1000/-home-ahmed-Ahmed-home-1--Projects-Research-comm-core/5a9f67e0-6b70-483d-990f-2c6160a406a3/scratchpad/deploy_lam,planner.horizon=2,planner.n_steps=1,planner.num_samples=4,planner.solver=c3jepa,planner.topk=2,tracing.max_depth=4,vqvae.pre_quant_activation=true,wandb.enabled=false
    id: ???
    num: ???
    config_name: deploy/config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ahmed/Ahmed-home/1- Projects/Research/Journal 2/code/c3jepa-wm/mains
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ahmed/Ahmed-home/1- Projects/Research/Journal 2/code/c3jepa-wm/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ahmed/Ahmed-home/1- Projects/Research/Journal 2/code/c3jepa-wm/mains/outputs/2026-10-22/23-02-00
    choices:
      train/model@vqvae: vqvae
      train/model@jepa: control_jepa
      comm/env@env: findgoal
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
